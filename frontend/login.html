<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Blood Emergency Website</title>
    <meta name="description" content="Login to your Blood Emergency donor account." />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="auth-page">
        <div class="auth-card slide-up">
            <div class="auth-logo">
                <div class="logo-icon">🩸</div>
                <h1>Welcome Back</h1>
                <p>Login to your Blood Emergency account</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com"
                        autocomplete="email" required />
                    <span class="form-error" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password <span class="required">*</span></label>
                    <div style="position:relative;">
                        <input type="password" id="password" class="form-control" placeholder="Your password"
                            autocomplete="current-password" required style="padding-right:48px;" />
                        <button type="button" id="toggle-pwd"
                            style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;">👁️</button>
                    </div>
                    <span class="form-error" id="password-error"></span>
                </div>

                <div class="flex-between mb-lg" style="margin-bottom:var(--space-lg);">
                    <label
                        style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--text-secondary);cursor:pointer;">
                        <input type="checkbox" id="remember-me" style="accent-color:var(--red-600);" />
                        Remember me
                    </label>
                    <a href="#" style="font-size:0.85rem;color:var(--red-400);">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
                    <span class="btn-text">Login to Account</span>
                </button>
            </form>

            <!-- Demo credentials info -->
            <div
                style="margin-top:var(--space-xl);padding:var(--space-md);background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:var(--radius-md);">
                <p style="font-size:0.8rem;color:var(--color-info);font-weight:600;margin-bottom:6px;">💡 Demo
                    Credentials</p>
                <p style="font-size:0.78rem;color:var(--text-muted);">Admin: admin@bloodemergency.com / Admin@1234</p>
                <p style="font-size:0.78rem;color:var(--text-muted);">Run <code
                        style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;">npm run seed</code>
                    first to create admin.</p>
            </div>

            <div class="auth-switch">
                Don't have an account? <a href="register.html">Register as Donor</a>
            </div>
            <div class="auth-switch mt-sm" style="margin-top:var(--space-sm);">
                <a href="index.html" style="color:var(--text-muted);">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Redirect if already logged in
        if (Auth.isLoggedIn()) {
            window.location.href = Auth.isAdmin() ? 'admin.html' : 'dashboard.html';
        }

        // Toggle password visibility
        document.getElementById('toggle-pwd').addEventListener('click', () => {
            const input = document.getElementById('password');
            const btn = document.getElementById('toggle-pwd');
            if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
            else { input.type = 'password'; btn.textContent = '👁️'; }
        });

        // Form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            let valid = true;

            if (!email) { showFieldError('email', 'Email is required'); valid = false; }
            if (!password) { showFieldError('password', 'Password is required'); valid = false; }
            if (!valid) return;

            const btn = document.getElementById('submit-btn');
            setButtonLoading(btn, true);

            try {
                const res = await API.auth.login({ email, password });
                Auth.setToken(res.token);
                Auth.setUser(res.user);
                showToast(`Welcome back, ${res.user.name}!`, 'success');
                setTimeout(() => {
                    window.location.href = res.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
                }, 800);
            } catch (err) {
                showToast(err.message, 'error', 'Login Failed');
                setButtonLoading(btn, false);
            }
        });

        function showFieldError(field, msg) {
            document.getElementById(field).classList.add('error');
            document.getElementById(`${field}-error`).textContent = msg;
        }

        function clearErrors() {
            ['email', 'password'].forEach(f => {
                document.getElementById(f).classList.remove('error');
                document.getElementById(`${f}-error`).textContent = '';
            });
        }
    </script>
</body>

</html>
